<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#1a1a2e" />
    <meta name="format-detection" content="telephone=no" />
    <title>成帝，等闲之事</title>
    <style>
      body { margin:0; padding:0; background:#1a1a2e; }
      #loading {
        position:fixed; top:0; left:0; right:0; bottom:0;
        display:flex; flex-direction:column;
        align-items:center; justify-content:center;
        background:linear-gradient(135deg,#1a1a2e,#16213e,#0f3460);
        z-index:10000; transition:opacity .5s;
      }
      #loading.hide { opacity:0; }
      #loading h1 { color:#e2b714; font-family:serif; font-size:28px; margin-bottom:8px; }
      #loading p { color:#8899aa; font-family:sans-serif; font-size:14px; margin:0 0 30px; }
      .spinner { width:40px; height:40px; border:3px solid rgba(226,183,20,.2); border-top-color:#e2b714; border-radius:50%; animation:spin 1s linear infinite; }
      @keyframes spin { to { transform:rotate(360deg); } }
      #errors { color:#ff6666; font-family:monospace; font-size:13px; margin-top:20px; padding:16px; max-width:90%; white-space:pre-wrap; background:rgba(0,0,0,.3); border-radius:8px; max-height:40vh; overflow-y:auto; }
    </style>
  </head>
  <body>
    <div id="loading">
      <h1>成帝，等闲之事</h1>
      <p>踏上修炼之路，问鼎武道巅峰</p>
      <div class="spinner"></div>
      <div id="errors"></div>
    </div>
    <div id="root"></div>

    <script>
    (function(){
      var el=document.getElementById('errors'),logs=[];
      function add(m){logs.push(m);if(logs.length>30)logs.shift();if(el){el.style.display='block';el.textContent=logs.join('\n');}}
      window.__addLog=add;
      add('[boot] 启动中');
      window.onerror=function(m,u,l,c,e){add('[err] '+(e&&e.stack?e.stack.slice(0,200):m));return false;};
      window.addEventListener('unhandledrejection',function(e){add('[promise] '+(e.reason&&e.reason.message?e.reason.message:String(e.reason)));});
      window.__hideLoading=function(){
        var s=document.getElementById('loading');
        if(s){s.classList.add('hide');setTimeout(function(){s.style.display='none';},500);}
      };
      setTimeout(function(){
        var s=document.getElementById('loading');
        if(s&&!s.classList.contains('hide')){add('[boot] ⚠ timeout 15s');s.classList.add('hide');}
      },15000);
    })();
    </script>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
